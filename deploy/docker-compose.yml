services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clipper_rabbitmq
    restart: unless-stopped
    ports:
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: clipper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clipper
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clipper -d clipper']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ..
    container_name: clipper_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql://clipper:${POSTGRES_PASSWORD:-clipper}@postgres:5432/clipper?schema=public
    ports:
      - '4000:4000'
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build: ../worker
    container_name: clipper_worker
    restart: unless-stopped
    environment:
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      NEST_API_URL: http://backend:4000
      CLIPPER_STAGE: all
      USE_S3: ${USE_S3:-true}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-ru-1}
    depends_on:
      rabbitmq:
        condition: service_started

volumes:
  rabbitmq_data:
  postgres_data:
